name: MCP OAuth Discovery Phase 2A Preflight

on:
  pull_request:

permissions:
  contents: read

jobs:
  fail-closed-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Lint and verify OAuth metadata is gated off by default
        run: |
          set -Eeuo pipefail
          php -l app/Http/Controllers/Api/McpOAuthDiscoveryController.php
          php -l routes/web.php
          php -l config/mcp.php
          php -l tests/Feature/McpOAuthDiscoveryTest.php
          python3 - <<'PY'
          from pathlib import Path
          route=Path("routes/web.php").read_text()
          config=Path("config/mcp.php").read_text()
          controller=Path("app/Http/Controllers/Api/McpOAuthDiscoveryController.php").read_text()
          api=Path("routes/api.php").read_text()
          docs=Path("docs/MCP_OAUTH_PHASE2_ACCEPTANCE.md").read_text()
          assert "MCP_OAUTH_DISCOVERY_ENABLED" in config
          assert "'oauth_provider_accepted' => false" in config
          assert "'oauth_ready' => false" in config
          assert "oauth-protected-resource" in route
          assert "oauth-authorization-server" in route
          assert "McpOAuthDiscoveryController" in route
          assert "config('mcp.oauth_provider_accepted', false)" in controller
          assert "config('mcp.oauth_ready', false)" in controller
          assert "config('mcp.oauth_discovery_enabled', false)" in controller
          assert "Route::has('mcp.oauth.token')" in controller
          assert "Route::has('mcp.oauth.authorize')" in controller
          assert "private const ISSUER = 'https://learncambodia.com'" in controller
          assert "private const RESOURCE = 'https://learncambodia.com/api/mcp/oauth'" in controller
          # Both discovery documents must use the same default-closed policy.
          # The runtime discovery suite below verifies every gate independently.
          policy=Path("app/Support/McpOAuthDraftScopePolicy.php").read_text()
          assert controller.count("'scopes_supported' => array_keys(\\App\\Support\\McpOAuthDraftScopePolicy::scopes())") == 2
          assert "$scopes = ['mcp:read' =>" in policy
          assert "if (self::issuanceEnabled())" in policy
          assert "$scopes['mcp:write']" in policy
          assert "! EnsureMcpOAuthStagingEnabled::enabled()" in policy
          for gate in ["oauth_draft_writes_accepted", "oauth_draft_writes_enabled", "oauth_draft_scope_issuance_enabled", "oauth_draft_production_accepted"]:
            assert f"'{gate}' => (bool) env('MCP_{gate.upper()}', false)" in config
            assert f"config('mcp.{gate}', false)" in policy
          assert "'oauth_draft_production_admin_id' => (string) env('MCP_OAUTH_DRAFT_PRODUCTION_ADMIN_ID', '')" in config
          assert "config('mcp.oauth_draft_production_admin_id', '')" in policy
          assert "test_production_discovery_write_scope_requires_every_independent_gate" in Path("tests/Feature/McpOAuthDiscoveryTest.php").read_text()
          assert "'code_challenge_methods_supported' => ['S256']" in controller
          assert "'grant_types_supported' => ['authorization_code', 'refresh_token']" in controller
          assert "route('mcp.oauth.token', [], false)" in controller
          assert "Route::post('/mcp', [McpBridgeController::class, 'handle'])" in api
          assert "auth:sanctum" in api
          assert "Passport" in docs and "CSRF" in docs and "revocation" in docs
          for forbidden in ['MCP_REMOTE_WRITES_ENABLED=true','client_secret','password_grant']:
            if forbidden in controller:
              raise SystemExit("OAUTH_UNEXPECTED_DISCLOSURE_OR_MUTATION="+forbidden)
          print("MCP_OAUTH_DISCOVERY_FAIL_CLOSED_SOURCE=PASS")
          PY

  php-oauth-discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          extensions: mbstring, sqlite3, pdo_sqlite, fileinfo, curl, dom
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress --no-scripts
      - name: Test OAuth fail-closed metadata and retained bearer MCP security
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          php artisan test --filter=McpOAuthDiscoveryTest
          php artisan test --filter=McpBrowserBridgeTest
          php artisan test --filter=McpManagementTest
