name: MCP Passport Phase 2B Live Code Safety

on:
  pull_request:

permissions:
  contents: read

jobs:
  live-code-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify aaPanel release syntax, exact live hashes and rollback
        run: |
          set -Eeuo pipefail
          SCRIPT=support/operator/learncambodia-mcp-oauth-phase2b-stage-code-aapanel.sh
          bash -n "$SCRIPT"
          python3 tests/operator/test_mcp_oauth_phase2b_semantic_overlay.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path("support/operator/learncambodia-mcp-oauth-phase2b-stage-code-aapanel.sh")
          s=p.read_text()
          checks=[
            "MCP_PHASE2B_PINNED_CI=PASS",
            "MCP_PHASE2B_EXACT_LIVE_OVERLAYS=PASS",
            "MCP_PHASE2B_LOCKED_VENDOR_BUILT_IN_ISOLATION=PASS",
            "MCP_PHASE2B_SYNTAX_AND_HARD_DISABLED=PASS",
            "MCP_PHASE2B_ROLLBACK=RESTORED",
            "MCP_PHASE2B_ALL_EXISTING_ROUTES_PRESERVED=PASS",
            "MCP_PHASE2B_LIVE_MCP_SECURITY_AND_CLOSED_OAUTH=PASS",
            "MCP_PHASE2B_DISABLED_CODE_RELEASE=PASS",
            "MCP_OAUTH_MIGRATIONS=NOT_RUN",
            "MCP_OAUTH_KEYS=NOT_GENERATED",
            "MCP_OAUTH_TOKEN_ISSUANCE=DISABLED",
            "MCP_REMOTE_WRITES=UNCHANGED",
            "MCP_DATABASE_MUTATIONS=NONE",
            "MCP_CONTENT_MUTATIONS=NONE",
            "d28f586cf17f0c611aca01855ff18c4e102d9579",
            "6185fd2161ba77c0ef164a0e1b10dab57ebe4c6a",
            "4edfe4827731147fd91c0d732efa29ce49331304",
            "37f2ee943477b906bad487433fe5dae12628480b",
            "8292e92bacc9b9be2a92140f9f235935a14a606f",
            "9faff0c2c9398d71c68c34e0190a6fac60313ea6",
            "composer install --no-dev --no-scripts",
            "phpseclib",
            "oauth_provider_accepted",
            "oauth_ready",
            "auth:sanctum",
            "MCP_PHASE2B_VERIFIED_ADDITIVE_OVERLAY=",
          ]
          for line in checks:
            if line == "phpseclib": continue # dependency is in composer.lock, not script text
            assert line in s, line
          for bad in ("artisan migrate", "artisan passport:keys", "git reset --hard",
                      "chmod -R 777", "MCP_REMOTE_WRITES_ENABLED=true",
                      "artisan optimize:clear", "composer update", "artisan db:wipe",
                      "artisan migrate:fresh"):
            assert bad not in s, bad
          print("MCP_PHASE2B_OPERATOR_SAFETY=PASS")
          PY
      - name: Check exact files remain closed in review branch
        run: |
          set -Eeuo pipefail
          grep -Fq "'oauth_ready' => false" config/mcp.php
          grep -Fq "'oauth_provider_accepted' => false" config/mcp.php
          grep -Fq 'auth:sanctum' routes/api.php
          grep -Fq 'Passport::ignoreRoutes()' app/Providers/AppServiceProvider.php
          grep -Fq 'laravel/passport' composer.lock
          echo MCP_PHASE2B_SOURCE_STILL_FAIL_CLOSED=PASS
      - name: Check Phase 3A disabled overlay syntax and semantic preservation
        run: |
          set -Eeuo pipefail
          bash -n support/operator/learncambodia-mcp-oauth-phase3a-disabled-promotion-aapanel.sh
          python3 - <<'PY'
          import re, subprocess, tempfile
          from pathlib import Path
          s=Path("support/operator/learncambodia-mcp-oauth-phase3a-disabled-promotion-aapanel.sh").read_text()
          for body in re.findall(r"<<'PY'\n(.*?)\nPY",s,re.S):
              compile(body, "<operator>", "exec")
          for bad in ("artisan migrate", "artisan passport:keys", "composer update", "artisan optimize:clear", "git reset --hard"):
              assert bad not in s, bad
          for good in ("PINNED_CI=PASS","TARGETED_OVERLAYS=PASS","PHASE3A_PREPARE=PASS","PHASE3A_ROLLBACK=RESTORED","ROUTES_PRESERVED=PASS","OAUTH_TOKEN_ISSUANCE=DISABLED"):
              assert good in s, good
          body=next(b for b in re.findall(r"<<'PY'\n(.*?)\nPY",s,re.S) if 'live.count(old)' in b)
          path="bootstrap/app.php"
          base=subprocess.check_output(["git","show","e7416ea12cc64a427818c6f9da159b89ea22eaef:"+path],text=True)
          target=subprocess.check_output(["git","show","8bd5aa20ee9f0ed217308f1c017a5800d86ade04:"+path],text=True)
          live=base.replace("use App\\Console\\Commands\\AssignAccountRole;", "// Live-only customization\nuse App\\Console\\Commands\\AssignAccountRole;",1)
          with tempfile.TemporaryDirectory() as d:
              root=Path(d)
              for label,value in [("base",base),("new",target),("old",live),("ready","")]:
                  p=root/label/path
                  p.parent.mkdir(parents=True)
                  p.write_text(value)
              subprocess.run(["python3","-c",body,d,path],check=True)
              result=(root/"ready"/path).read_text()
              assert "// Live-only customization" in result
              assert result.replace("// Live-only customization\n","",1)==target
          print("PHASE3A_OPERATOR_SYNTAX_AND_OVERLAY=PASS")
          PY
