name: MCP Password Prompt Cache Regression

on:
  pull_request:

permissions:
  contents: read

jobs:
  source-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate focused installer and cache-busting/reauth fallback invariants
        run: |
          set -Eeuo pipefail
          bash -n support/operator/learncambodia-mcp-password-cache-fix-aapanel.sh
          php -l tests/Feature/McpManagementTest.php
          node --check public/js/mcp-management.js
          python3 - <<'PY'
          from pathlib import Path
          view=Path('resources/views/workspace/admin/mcp-management.blade.php').read_text()
          js=Path('public/js/mcp-management.js').read_text()
          script=Path('support/operator/learncambodia-mcp-password-cache-fix-aapanel.sh').read_text()
          assert "hash_file('sha256', public_path('js/mcp-management.js'))" in view
          assert "hash_file('sha256', public_path('css/mcp-management.css'))" in view
          assert "?v=bridge-1" not in view
          assert 'data-mcp-ui-version="password-reauth-v2"' in view
          assert "route('password.confirm')" in view
          assert "Website password confirmation is required." in view
          assert 'id="mcp-browser-password"' in view
          assert "passwordVerifiedForThisConsent" in js
          assert "passwordForm?.addEventListener('submit'" in js
          assert "MCP_GATEWAY_FLAGS=UNCHANGED" in script
          assert "MCP_CONTENT_MUTATIONS=NONE" in script
          assert "MCP_PASSWORD_UI_ROLLBACK=RESTORED" in script
          assert "MCP_UI_PINNED_CI=PASS" in script
          for forbidden in ['migrate:fresh','db:wipe','git reset --hard','chmod -R 777',
                            "artisan migrate", "MCP_GATEWAY_ENABLED=true", "MCP_REMOTE_WRITES_ENABLED=true"]:
            assert forbidden not in script,forbidden
          print('MCP_PASSWORD_CACHE_SOURCE_SAFETY=PASS')
          PY

  php-render-and-auth:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          extensions: mbstring, sqlite3, pdo_sqlite, fileinfo, curl, dom
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress --no-scripts
      - name: Render real admin MCP page and verify password route security
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          php artisan test --filter=McpManagementTest
          php artisan test --filter=McpBrowserBridgeTest

  browser-three-viewports:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false --no-audit --no-fund @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Ensure consent opens password step, then issues token on desktop/tablet/mobile
        env:
          BROWSER_BASE_URL: http://127.0.0.1:8000
        run: |
          npx playwright test tests/browser/mcp-browser-bridge.spec.mjs \
            tests/browser/mcp-management.spec.mjs \
            --config=tests/browser/playwright.config.mjs \
            --project=desktop-chromium \
            --project=tablet-chromium \
            --project=mobile-chromium
