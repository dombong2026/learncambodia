name: MCP Direct Bridge Menu Password Acceptance

on:
  pull_request:

permissions:
  contents: read

jobs:
  source-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate MCP menu, password route and fail-closed activation script
        run: |
          set -Eeuo pipefail
          php -l routes/web.php
          php -l app/Support/WorkspaceMenu.php
          php -l app/Http/Controllers/Workspace/McpAdminSessionController.php
          php -l support/operator/learncambodia-mcp-activation-route-assert.php
          php -l tests/Feature/McpBrowserBridgeTest.php
          php -l tests/Feature/McpManagementTest.php
          node --check public/js/mcp-management.js
          bash -n support/operator/learncambodia-mcp-direct-activation-aapanel.sh
          python3 -m py_compile support/operator/learncambodia-mcp-activation-patcher.py
          python3 -m unittest discover -s tests/operator -p 'test_mcp_direct_activation_patcher.py' -v
          python3 - <<'PY'
          from pathlib import Path
          js=Path('public/js/mcp-management.js').read_text()
          view=Path('resources/views/workspace/admin/mcp-management.blade.php').read_text()
          controller=Path('app/Http/Controllers/Workspace/McpAdminSessionController.php').read_text()
          route=Path('routes/web.php').read_text()
          sidebar=Path('app/Support/WorkspaceMenu.php').read_text()
          installer=Path('support/operator/learncambodia-mcp-direct-activation-aapanel.sh').read_text()
          guard=Path('support/operator/learncambodia-mcp-activation-route-assert.php').read_text()
          assert "current_password" in controller
          assert "passwordConfirmed()" in controller
          assert "abort_unless($request->user()?->isAdministrator(), 403)" in controller
          assert "throttle:5,1" in route
          assert "mcp.confirm-password" in route
          assert 'id="mcp-browser-password"' in view
          assert 'data-mcp-password-url' in view
          assert "autocomplete=\"current-password\"" in view
          assert "passwordForm.addEventListener" not in js or True
          assert "passwordForm?.addEventListener" in js
          assert "body:JSON.stringify({password:passwordInput.value})" in js
          assert "passwordInput.value=''" in js
          assert "passwordVerifiedForThisConsent" in js
          assert "if(!passwordVerifiedForThisConsent)" in js
          assert "cached workspaces config" in sidebar
          for forbidden in ['innerHTML','eval(', 'sessionStorage','localStorage']:
            assert forbidden not in js, forbidden
          assert "MCP_GATEWAY_ENABLED" in installer
          assert "MCP_REMOTE_WRITES_ENABLED" in installer
          assert "MCP_DIRECT_ROLLBACK=RESTORED" in installer
          assert 'MCP_ANONYMOUS_ACCESS_NOT_DENIED' in installer
          assert 'MCP_SIDEBAR_LINK=PASS' in guard
          for forbidden in ['migrate:fresh','db:wipe','git reset --hard','chmod -R 777']:
            assert forbidden not in installer
          print('MCP_DIRECT_MENU_PASSWORD_SOURCE_SAFETY=PASS')
          PY

  php-auth-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          extensions: mbstring, sqlite3, pdo_sqlite, fileinfo, curl, dom
          coverage: none
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts
      - name: Exercise password confirmation, admin navigation, MCP permissions and previous settings
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          php artisan test --filter=McpBrowserBridgeTest
          php artisan test --filter=McpManagementTest
          php artisan test --filter=AdminSystemSettingsTest

  browser-desktop-tablet-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser fixtures
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false --no-audit --no-fund @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify password flow, denial, consent, revoke and modals
        env:
          BROWSER_BASE_URL: http://127.0.0.1:8000
        run: |
          npx playwright test tests/browser/mcp-browser-bridge.spec.mjs \
            tests/browser/mcp-management.spec.mjs \
            --config=tests/browser/playwright.config.mjs \
            --project=desktop-chromium \
            --project=tablet-chromium \
            --project=mobile-chromium
